name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DotnetCoreS3Utility.sln

      - name: Dependency vulnerability report
        run: dotnet list DotnetCoreS3Utility.sln package --vulnerable --include-transitive

      - name: Build
        run: dotnet build DotnetCoreS3Utility.sln --no-restore --configuration Release

      # Integration tests start LocalStack and MongoDB via Testcontainers; the runner's
      # Docker daemon is all they need.
      - name: Test
        run: dotnet test DotnetCoreS3Utility.sln --no-build --configuration Release --verbosity normal

  cloudflare:
    name: Cloudflare deploy dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: bash -n scripts/cloudflare-deploy.sh
      - run: bash scripts/cloudflare-deploy.sh
        env:
          VALIDATE_ONLY: "true"
          APP_HOST: files.example.com
          R2_ACCESS_KEY_ID: dry-run
          R2_SECRET_ACCESS_KEY: dry-run
          DATABASE_URL: mongodb+srv://dry-run:dry-run@dry-run.mongodb.net/s3utility
          API_KEY: dry-run
